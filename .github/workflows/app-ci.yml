name: app-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - .github/workflows/app-ci.yml
  push:
    branches:
      - main
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - .github/workflows/app-ci.yml

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Report Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
